name: Build and Push Docker Image

on:
  push:
    branches:
      - main

concurrency:
  group: build-and-push

env:
  PLAYWRIGHT_TAG: v1.55.0-noble

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --build-arg PLAYWRIGHT_TAG=$PLAYWRIGHT_TAG --tag ${{ vars.REGISTRY_HOST }}/microsoft-playwright-java-jdk25:$PLAYWRIGHT_TAG .

      - name: Push Docker Image
        run: |
          docker push ${{ vars.REGISTRY_HOST }}/microsoft-playwright-java-jdk25:$PLAYWRIGHT_TAG
